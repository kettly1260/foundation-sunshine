name: ARM64 ViGEmBus signed-driver smoke (disposable CI only)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-mf-arm64
    paths:
      - .github/workflows/arm64-vigembus-smoke.yml
      - tools/native-mf/arm64_vigem_client_smoke.cpp

permissions:
  contents: read

jobs:
  verify-signed-vigembus:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Verify Windows ARM64 disposable runner
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne "Arm64") { throw "Refusing to install driver outside Windows ARM64 test runner" }
          Write-Host "Using disposable GitHub-hosted ARM64 runner; this does NOT access the user's PC"
      - name: Download pinned official ViGEmBus 1.22.0 and verify SHA256 and signature
        shell: pwsh
        run: |
          $url = "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          $path = Join-Path $env:RUNNER_TEMP "ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "89220a7865076b342892f98865f3499fb7c4cfd673159e89d352c360fd014c6a"
          if ($hash -ne $expected) { throw "ViGEmBus checksum mismatch" }
          $sig = Get-AuthenticodeSignature -LiteralPath $path
          if ($sig.Status.ToString() -ne "Valid") { throw "ViGEmBus vendor installer Authenticode verification failed: $($sig.Status)" }
          "VIGEM_INSTALLER=$path" >> $env:GITHUB_ENV
          Write-Host "Verified signed ViGEmBus multiarch installer; publisher $($sig.SignerCertificate.Subject)"
      - name: Install ViGEmBus only inside ephemeral runner
        shell: pwsh
        run: |
          # No test certificates, no bcdedit, no Secure Boot changes.
          $p = Start-Process -FilePath $env:VIGEM_INSTALLER -ArgumentList "/quiet", "/norestart" -Wait -NoNewWindow -PassThru
          Write-Host "ViGEmBus installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin @(0,3010,1641)) { throw "ViGEmBus install error $($p.ExitCode)" }
          if ($p.ExitCode -ne 0) { throw "ViGEmBus requires reboot; this CI does not force reboot" }
      - name: Validate installed ARM64 bus-driver PE and PnP device
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sys = Join-Path $env:windir "System32\drivers\ViGEmBus.sys"
          if (!(Test-Path -LiteralPath $sys)) { throw "ViGEmBus.sys not installed" }
          $sig = Get-AuthenticodeSignature -LiteralPath $sys
          if ($sig.Status.ToString() -ne "Valid") { throw "Installed ViGEmBus.sys signature invalid: $($sig.Status)" }
          $bytes = [System.IO.File]::ReadAllBytes($sys)
          $offset = [BitConverter]::ToInt32($bytes,0x3c)
          $machine = [BitConverter]::ToUInt16($bytes,$offset+4)
          Write-Host ("Installed ViGEmBus driver machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0xAA64) { throw "Installed ViGEmBus is not native ARM64" }
          Write-Host "Service status from SCM:"
          sc.exe query ViGEmBus
          Write-Host "Driver information from CIM:"
          Get-CimInstance Win32_SystemDriver -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)vigem' -or $_.DisplayName -match '(?i)vigem|virtual gamepad' } |
            Format-List Name,DisplayName,State,Started,StartMode,PathName
          Write-Host "Device IDs before and after PnP rescan:"
          for ($try = 0; $try -lt 3; $try++) {
            $devices = @(Get-PnpDevice -ErrorAction SilentlyContinue |
              Where-Object { $_.FriendlyName -match '(?i)ViGEm|Virtual Gamepad|Nefarius' -or $_.InstanceId -match '(?i)ViGEm|Nefarius' })
            $present = @($devices | Where-Object { $_.Status -eq 'OK' })
            $devices | Format-Table FriendlyName,Status,InstanceId -AutoSize
            if ($present.Count -gt 0) { break }
            if ($try -eq 0) { pnputil.exe /scan-devices }
            Start-Sleep -Seconds 3
          }
          $report = [ordered]@{
            os = "Windows ARM64"
            installed_driver_architecture = "ARM64"
            pnp_devices = @($devices | Select-Object FriendlyName,Status,InstanceId)
            pnp_device_present_and_ok = ($present.Count -gt 0)
            driver_signature_status = $sig.Status.ToString()
            hardware_test = "Driver file verified; bus PnP state reported separately; X360/DS4 emulation not yet verified"
            run_location = "disposable GitHub ARM64 CI runner; not the user's host"
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\vigem-arm64-smoke.json"
          if ($present.Count -eq 0) {
            throw "Signed ARM64 ViGEmBus.sys is installed, but there is no OK PnP bus after rescan; inspect evidence"
          }
          Write-Host "ViGEmBus native ARM64 PnP load verified successfully"
      - name: Checkout pinned Sunshine ViGEmClient SDK
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize only the pinned ViGEmClient SDK
        shell: pwsh
        run: |
          git -c core.longpaths=true submodule update --init third-party/ViGEmClient
          if ($LASTEXITCODE -ne 0) { throw "ViGEmClient submodule checkout failed" }
          $sha = (git -C third-party/ViGEmClient rev-parse HEAD).Trim()
          if ($sha -ne "8d71f6740ffff4671cdadbca255ce528e3cd3fef") {
            throw "Unexpected pinned Sunshine ViGEmClient source: $sha"
          }
      - name: Setup native ARM64 C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build and run X360 / DS4 native client smoke
        shell: pwsh
        run: |
          cmake -S third-party/ViGEmClient -B "$env:RUNNER_TEMP/vigemclient-build" -G "Visual Studio 17 2022" -A ARM64
          if ($LASTEXITCODE -ne 0) { throw "ViGEmClient ARM64 CMake configuration failed" }
          cmake --build "$env:RUNNER_TEMP/vigemclient-build" --config Release --target ViGEmClient --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "ViGEmClient ARM64 build failed" }
          $lib = Get-ChildItem "$env:RUNNER_TEMP/vigemclient-build" -Recurse -Filter "ViGEmClient.lib" -File |
            Select-Object -First 1
          if (!$lib) { throw "ViGEmClient ARM64 static library not found" }
          cl /nologo /EHsc /std:c++17 /Ithird-party/ViGEmClient/include tools/native-mf/arm64_vigem_client_smoke.cpp $lib.FullName setupapi.lib /link /out:"$env:RUNNER_TEMP/vigem_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "ViGEmClient ARM64 smoke build failed" }
          & "$env:RUNNER_TEMP/vigem_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native X360/DS4 controller attach/remove smoke failed" }
          Write-Host "Functional ARM64 gamepad virtual target attach/remove verified"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-vigembus-driver-smoke-evidence
          path: ${{ runner.temp }}/vigem-arm64-smoke.json
          if-no-files-found: warn
