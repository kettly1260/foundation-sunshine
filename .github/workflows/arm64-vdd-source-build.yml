name: Windows ARM64 ZakoVDD source portability experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-mf-arm64
    paths:
      - scripts/arm64_vdd_project_port.py
      - .github/workflows/arm64-vdd-source-build.yml

permissions:
  contents: read

jobs:
  arm64-idddcx:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: qiin2333/zako-vdd
          ref: 88d117431549bcba22fea27ded3d4804c79b51fb
          path: vdd-source
          submodules: false
      - name: Verify pinned upstream source and add experimental ARM64 platform
        shell: pwsh
        run: |
          $actual = (git -C vdd-source rev-parse HEAD).Trim()
          if ($actual -ne "88d117431549bcba22fea27ded3d4804c79b51fb") {
            throw "Unexpected upstream ZakoVDD source commit: $actual"
          }
          python scripts/arm64_vdd_project_port.py vdd-source/ZakoVDD/ZakoVDD.vcxproj
          if ($LASTEXITCODE -ne 0) { throw "ARM64 project conversion failed" }
          Write-Host "Pinned ZakoVDD v0.17.5 source: $actual"

      - name: Configure Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install Windows Driver Kit if missing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tasks = Get-ChildItem "C:\Program Files*\Windows Kits\10\build\*\bin\Microsoft.DriverKit.Build.Tasks.17.0.dll" -ErrorAction SilentlyContinue
          $wdf = Get-ChildItem "C:\Program Files*\Windows Kits\10\Include\*\wdf" -ErrorAction SilentlyContinue
          if (!$tasks -or !$wdf) {
            Write-Host "Installing official WDK in ephemeral CI machine; NEVER on the user PC"
            $setup = "$env:TEMP\wdksetup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2272234" -OutFile $setup -UseBasicParsing
            $p = Start-Process -FilePath $setup -ArgumentList "/quiet","/norestart","/features","+" -Wait -NoNewWindow -PassThru
            if ($p.ExitCode -ne 0) { throw "WDK installer failed: $($p.ExitCode)" }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -products * -requires Microsoft.Component.MSBuild -version "[17.0,18.0)" -property installationPath -latest
          if (!$installation) { throw "Visual Studio 2022 with MSBuild not found" }
          $vsixInstaller = Join-Path $installation "Common7\IDE\VSIXInstaller.exe"
          $vsix = Get-ChildItem "C:\Program Files*\Windows Kits\10\Vsix\*\WDK.vsix" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$vsix) { throw "WDK VS integration VSIX not found" }
          $p = Start-Process -FilePath $vsixInstaller -ArgumentList "/q", $vsix.FullName -Wait -NoNewWindow -PassThru
          Write-Host "WDK VSIX install exit code $($p.ExitCode)"
          $tasks = Get-ChildItem "C:\Program Files*\Windows Kits\10\build\*\bin\Microsoft.DriverKit.Build.Tasks.17.0.dll" -ErrorAction SilentlyContinue
          if (!$tasks) { throw "WDK MSBuild tasks still missing after installation" }

      - name: Build unsigned ARM64 IddCx / UMDF ZakoVDD driver
        shell: pwsh
        run: |
          msbuild vdd-source/ZakoVDD/ZakoVDD.vcxproj /m /p:Configuration=Release /p:Platform=ARM64 /p:SignMode=Off /p:EnableCodeAnalysis=false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ZakoVDD ARM64 compilation or linking failed" }

      - name: Verify PE ARM64 and stage unsigned build evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem vdd-source -Recurse -Filter ZakoVDD.dll -File |
            Where-Object { $_.FullName -match '(?i)arm64' } | Select-Object -First 1
          if (!$dll) { throw "ARM64 ZakoVDD.dll output not found" }
          $inf = Get-ChildItem vdd-source -Recurse -Filter ZakoVDD.inf -File |
            Where-Object { $_.FullName -match '(?i)arm64' } | Select-Object -First 1
          if (!$inf) { throw "Stamped ARM64 driver INF not found" }
          python -c "import struct,sys; d=open(sys.argv[1],'rb').read();o=struct.unpack_from('<I',d,60)[0];m=struct.unpack_from('<H',d,o+4)[0];print('ZakoVDD PE machine',hex(m));sys.exit(0 if m==0xaa64 else 1)" $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw "ZakoVDD output is not native Windows ARM64" }
          $text = Get-Content -LiteralPath $inf.FullName -Raw
          if ($text -match '\$ARCH\$' -or $text -match '\$UMDFVERSION\$' -or $text -notmatch 'NTarm64') {
            throw "ARM64 INF not stamped for target architecture"
          }
          New-Item -Force -ItemType Directory arm64-vdd-unsigned | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination arm64-vdd-unsigned/
          Copy-Item -LiteralPath $inf.FullName -Destination arm64-vdd-unsigned/
          @'
          UNSIGNED DEVELOPMENT OUTPUT, NOT AN INSTALLABLE RELEASE
          Upstream: qiin2333/zako-vdd v0.17.5, commit 88d117431549bcba22fea27ded3d4804c79b51fb
          Target: ARM64 / UMDF 2 / IddCx
          NO signed catalog is included.
          DO NOT install on a production machine, do NOT disable Secure Boot, do NOT enable test signing.
          Next stages: production driver signing, clean-VM PnP tests, control IOCTL compatibility, streaming.
          '@ | Set-Content -LiteralPath arm64-vdd-unsigned/READ-FIRST.txt
          Write-Host "Built native ARM64 VDD driver in isolated GitHub CI; installation not attempted"

      - uses: actions/upload-artifact@v4
        with:
          name: zako-vdd-arm64-UNSIGNED-development-only
          path: arm64-vdd-unsigned/*
          if-no-files-found: error
          retention-days: 7

      - name: Test-sign and verify WDK-generated ARM64 driver catalog (no install)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path 'arm64-vdd-unsigned').Path
          $dir = Join-Path (Get-Location).Path 'arm64-vdd-test-signed'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath (Join-Path $package 'ZakoVDD.inf') -Destination $dir
          Copy-Item -LiteralPath (Join-Path $package 'ZakoVDD.dll') -Destination $dir

          # MSBuild has already run WDK's signability check and Inf2Cat.
          # Its generated catalog belongs to this exact stamped INF and DLL.
          $built = Join-Path (Get-Location).Path 'vdd-source/ZakoVDD/ARM64/Release/ZakoVDD'
          $catalogs = @(Get-ChildItem -LiteralPath $built -File -Filter '*.cat' -ErrorAction Stop)
          if ($catalogs.Count -ne 1) { throw "Expected one WDK catalog, found $($catalogs.Count)" }
          $cat = Join-Path $dir 'ZakoVDD.cat'
          Copy-Item -LiteralPath $catalogs[0].FullName -Destination $cat
          Write-Host "Reused WDK-generated catalog: $($catalogs[0].FullName)"

          # Look for SignTool in the installed Windows SDK, not Inf2Cat.exe.
          $kitBin = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits/10/bin'
          $tools = @(Get-ChildItem -LiteralPath $kitBin -Recurse -File -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object -Property FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Windows SDK x64 SignTool not installed' }
          $signtool = $tools[0].FullName
          Write-Host "Using SignTool: $signtool"

          # Cryptographically verify the catalog WITHOUT modifying Root or TrustedPublisher.
          # Windows hosted runners can block indefinitely on self-signed Root imports.
          $cert = $null
          try {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Foundation Sunshine Ephemeral VDD CI Test Only' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy NonExportable -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
            if (!$cert.HasPrivateKey) { throw 'Temporary test certificate has no private key' }
            $publicCert = Join-Path $dir 'ZakoVDD-TEST-ONLY.cer'
            Export-Certificate -Cert $cert -FilePath $publicCert | Out-Null
            & $signtool sign /v /fd SHA256 /s My /sha1 $cert.Thumbprint $cat
            if ($LASTEXITCODE -ne 0) { throw "CAT signing failed: $LASTEXITCODE" }
            Write-Host 'CAT signed; verifying SignedCms signature with chain trust intentionally skipped'

            Add-Type -AssemblyName 'System.Security.Cryptography.Pkcs'
            $cms = [System.Security.Cryptography.Pkcs.SignedCms]::new()
            $cms.Decode([System.IO.File]::ReadAllBytes($cat))
            $cms.CheckSignature($true)
            if ($cms.SignerInfos.Count -ne 1) { throw 'Unexpected number of catalog CMS signers' }
            $signerCertificate = $cms.SignerInfos[0].Certificate
            if (!$signerCertificate -or $signerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw 'CAT CMS signature certificate mismatch'
            }
            Write-Host 'CAT CMS signature cryptographically valid; INF and DLL hashes recorded below'
            $infHash = (Get-FileHash -LiteralPath (Join-Path $dir 'ZakoVDD.inf') -Algorithm SHA256).Hash
            $dllHash = (Get-FileHash -LiteralPath (Join-Path $dir 'ZakoVDD.dll') -Algorithm SHA256).Hash
            [ordered]@{
              architecture='ARM64'
              catalog_source='WDK MSBuild autogenerated'
              catalog_signed=$true
              cat_cms_signature_verified=$true
              cat_signer_matches_ephemeral_certificate=$true
              cat_member_hash_membership_verified=$false
              inf_sha256=$infHash
              dll_sha256=$dllHash
              infverif_separate='not_run_WDK_reported_x86_dependency_error'
              signer_thumbprint=$cert.Thumbprint
              certificate_private_key_exported=$false
              system_trust_store_modified=$false
              driver_install_attempted=$false
              driver_load_tested=$false
              production_trusted=$false
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir 'validation.json') -Encoding utf8
          }
          finally {
            if ($cert) {
              Remove-Item -LiteralPath ('Cert:\CurrentUser\My\' + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
          }
          @'
          DEVELOPMENT-ONLY: EPHEMERAL TEST-SIGNED ARM64 CATALOG.
          The .cer is PUBLIC; no private key is exported or distributed.
          WDK generated the CAT; SignedCms checked the CAT signature.
          CAT-to-INF/DLL membership was NOT independently verified.
          No operating-system trust stores were changed.
          This is NOT an install/load test and NOT a production-signed driver.
          Do NOT import this test certificate or change Secure Boot on a daily-use PC.
          '@ | Set-Content -LiteralPath (Join-Path $dir 'READ-FIRST.txt') -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: zako-vdd-arm64-test-catalog-not-install-validated
          path: arm64-vdd-test-signed/*
          if-no-files-found: error
          retention-days: 3
