      - name: Validate ARM64 driver INF and produce test-only CAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10"
          function Find-WdkTool($name) {
            $match = Get-ChildItem "$kit\bin" -Recurse -Filter $name -File | Where-Object FullName -Match 'x64' | Select-Object -First 1
            if (!$match) { throw "Missing $name" }
            return $match.FullName
          }
          $inf2cat = Find-WdkTool 'Inf2Cat.exe'
          $signtool = Find-WdkTool 'signtool.exe'
          $infverif = Get-ChildItem "$kit\Tools" -Recurse -Filter InfVerif.exe -File | Select-Object -First 1
          if (!$infverif) { throw 'Missing InfVerif.exe' }
          New-Item -Type Directory -Force arm64-vdd-test-signed | Out-Null
          Copy-Item arm64-vdd-unsigned/ZakoVDD.* arm64-vdd-test-signed/
          $dir = (Resolve-Path arm64-vdd-test-signed).Path
          & $infverif.FullName /w "$dir\ZakoVDD.inf"
          if ($LASTEXITCODE) { throw "InfVerif failure $LASTEXITCODE" }
          & $inf2cat "/driver:$dir" /os:10_GE_ARM64 /verbose
          if ($LASTEXITCODE) { throw "Inf2Cat failure $LASTEXITCODE" }
          $cat = "$dir\ZakoVDD.cat"
          if (!(Test-Path $cat)) { throw 'Missing CAT' }
          $cert = $null
          try {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Ephemeral Sunshine VDD CI Test' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddDays(2)
            Export-Certificate -Cert $cert -FilePath "$dir\ZakoVDD-TEST-ONLY.cer" | Out-Null
            & $signtool sign /fd SHA256 /s My /sha1 $cert.Thumbprint $cat
            if ($LASTEXITCODE) { throw "SignTool failure $LASTEXITCODE" }
            $signed = Get-AuthenticodeSignature $cat
            if (!$signed.SignerCertificate -or $signed.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Unexpected CAT signer' }
            [ordered]@{pe='ARM64';target='10_GE_ARM64';infverif='passed';inf2cat='passed';test_signed=$true;installation_tested=$false;production_trusted=$false} | ConvertTo-Json | Set-Content "$dir\validation.json"
          } finally {
            if ($cert) { Remove-Item ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue }
          }
          'DEVELOPMENT-ONLY. Not install validated. Private key not exported. Do not change Secure Boot on daily-use devices.' | Set-Content "$dir\READ-FIRST.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: zako-vdd-arm64-test-catalog-not-install-validated
          path: arm64-vdd-test-signed/*
          if-no-files-found: error
          retention-days: 3
