name: Native MFT ARM64 capability and encode benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-mf-arm64
    paths:
      - tools/native-mf/**
      - .github/workflows/native-mf-arm64.yml
permissions:
  contents: read
jobs:
  native-mf:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build capability probe and real encode benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cl /nologo /EHsc /std:c++17 /W4 /Fe:dist/native_mft_probe.exe tools/native-mf/native_mft_probe.cpp /link mfplat.lib mfuuid.lib ole32.lib oleaut32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Capability probe compilation failed' }
          cl /nologo /EHsc /std:c++17 /W4 /Fe:dist/native_mft_benchmark.exe tools/native-mf/native_mft_benchmark.cpp /link mfplat.lib mf.lib mfuuid.lib ole32.lib oleaut32.lib d3d11.lib dxgi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Encode benchmark compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-mf-arm64-tools
          path: dist/*.exe
