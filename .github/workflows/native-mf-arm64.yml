name: Native MFT ARM64 capability and encode benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-mf-arm64
    paths:
      - tools/native-mf/**
      - .github/workflows/native-mf-arm64.yml
      - src/platform/windows/native_mft_encoder.h
      - src/platform/windows/native_mft_sunshine.inc
      - scripts/arm64_native_mft_patch.py
permissions:
  contents: read
jobs:
  native-mf:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build capability probe and real encode benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cl /nologo /EHsc /std:c++17 /W4 /Fe:dist/native_mft_probe.exe tools/native-mf/native_mft_probe.cpp /link mfplat.lib mfuuid.lib ole32.lib oleaut32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Capability probe compilation failed' }
          cl /nologo /EHsc /std:c++17 /W4 /Fe:dist/native_mft_benchmark.exe tools/native-mf/native_mft_benchmark.cpp /link mfplat.lib mf.lib mfuuid.lib ole32.lib oleaut32.lib d3d11.lib dxgi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Encode benchmark compilation failed' }
          cl /nologo /EHsc /std:c++17 /W4 /Fe:dist/native_mft_av1_benchmark.exe tools/native-mf/native_mft_av1_benchmark.cpp /link mfplat.lib mf.lib mfuuid.lib ole32.lib oleaut32.lib d3d11.lib dxgi.lib
          if ($LASTEXITCODE -ne 0) { throw 'AV1 encode benchmark compilation failed' }
      - name: Verify native MFT backend header against ARM64 Windows SDK
        shell: pwsh
        run: |
          @'
          #include "../src/platform/windows/native_mft_encoder.h"
          int main() {
            auto codec = video::native_mft::codec_e::av1;
            return codec == video::native_mft::codec_e::av1 ? 0 : 1;
          }
          '@ | Set-Content -Path dist/native_mft_header_smoke.cpp -Encoding utf8
          cl /nologo /EHsc /std:c++17 /W4 /c /Fodist/native_mft_header_smoke.obj dist/native_mft_header_smoke.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Native MFT header cannot compile on Windows ARM64 SDK' }
      - name: Validate ARM64 experimental integration anchors
        shell: pwsh
        run: |
          python -m py_compile scripts/arm64_native_mft_patch.py
          python scripts/arm64_portable_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 portable bootstrap failed' }
          python scripts/arm64_native_mft_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Native MFT integration patch anchors failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-mf-arm64-tools
          path: dist/*.exe
